name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    # A real Postgres, not a mock. The hand-written CHECK and partial-unique
    # constraints can only be proven against the engine that enforces them
    # (TEST-01, TEST-08).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: agapay
          POSTGRES_PASSWORD: agapay
          POSTGRES_DB: agapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://agapay:agapay@127.0.0.1:5432/agapay_test?schema=public
      DIRECT_URL: postgresql://agapay:agapay@127.0.0.1:5432/agapay_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-1234
      WEB_ORIGIN: http://localhost:5173
      EMAIL_PROVIDER: console

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Apply migrations from empty
        # Proves every migration applies cleanly to a virgin database, which is
        # the only way to catch a migration that silently depends on state
        # (DB-24, TEST-08).
        run: npm run db:deploy -w @agapay/api

      - name: Seed
        run: npm run db:seed

      - name: Integration tests against Postgres
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=critical
